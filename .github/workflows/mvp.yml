name: MVP verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            chain/package-lock.json
      - run: npm ci
      - run: npm ci --prefix chain
      - run: npm run build
      - run: npm --prefix chain run build
      - run: npm run test:contracts
      - run: node scripts/language-share.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile python/vault_status.py
